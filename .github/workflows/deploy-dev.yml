# Source of truth: ci/.github/workflows/deploy-dev.yml
name: Deploy to Dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform init
        run: terraform init

      - name: Select dev workspace
        run: terraform workspace select -or-create dev

      - name: Terraform plan
        run: terraform plan -var-file=environments/dev/terraform.tfvars -out=tfplan

      - name: Terraform apply
        run: terraform apply tfplan

      - name: Run integration tests (optional)
        if: success()
        run: |
          echo "Integration tests would run against dev environment here"
          echo "Nessie health: curl -sf https://nessie.dev.lakehouse.internal:19120/q/health"
          echo "Trino health: curl -sf https://trino.dev.lakehouse.internal:8443/v1/info"
