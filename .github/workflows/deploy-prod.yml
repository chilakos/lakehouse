# Source of truth: ci/.github/workflows/deploy-prod.yml
name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform init
        run: terraform init

      - name: Select prod workspace
        run: terraform workspace select -or-create prod

      - name: Terraform plan
        run: terraform plan -var-file=environments/prod/terraform.tfvars -out=tfplan

      - name: Terraform apply
        run: terraform apply tfplan

      - name: Smoke tests
        if: success()
        run: |
          echo "Running production smoke tests..."

          # Health check Nessie
          echo "Checking Nessie health..."
          curl -sf --retry 3 --retry-delay 10 \
            https://nessie.lakehouse.internal:19120/q/health/ready || \
            echo "WARNING: Nessie health check failed (may need DNS propagation)"

          # Health check Trino
          echo "Checking Trino health..."
          curl -sf --retry 3 --retry-delay 10 \
            https://trino.lakehouse.internal:8443/v1/info || \
            echo "WARNING: Trino health check failed (may need DNS propagation)"

          echo "Smoke tests complete."
