[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-etl"
version = "0.1.0"
description = "ETL framework for the lakehouse architecture transformation"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "pyiceberg[s3fs,rest]>=0.11.0,<0.12.0",
    "duckdb>=1.2.0,<1.3.0",
    "faker>=30.0.0",
    "boto3>=1.35.0",
    "trino[sqlalchemy]>=0.330.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external services required)",
    "integration: Integration tests (requires Docker services)",
    "slow: Slow-running tests",
    "snowflake: Snowflake integration tests (requires Snowflake credentials)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["lakehouse_etl"]
