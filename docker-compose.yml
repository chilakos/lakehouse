services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin123456;
      mc mb --ignore-existing local/lakehouse-data;
      mc mb --ignore-existing local/lakehouse-onprem;
      mc version enable local/lakehouse-data;
      mc version enable local/lakehouse-onprem;
      echo 'MinIO buckets initialized';
      "

  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.4
    ports:
      - "19120:19120"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Nessie version store configuration (JDBC2 with PostgreSQL)
      NESSIE_VERSION_STORE_TYPE: JDBC2
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessie_local_dev

      # Nessie catalog configuration
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: lakehouse
      NESSIE_CATALOG_WAREHOUSES_LAKEHOUSE_LOCATION: s3://lakehouse-data/

      # S3/MinIO default options for Nessie catalog
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY_ID: admin
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_SECRET_ACCESS_KEY: admin123456
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  trino:
    image: trinodb/trino:479
    ports:
      - "8080:8080"
    depends_on:
      nessie:
        condition: service_healthy
    volumes:
      - ./infra/docker/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infra/docker/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./infra/docker/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/docker/trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./infra/docker/ranger/ranger-trino-security.xml:/etc/trino/ranger/ranger-trino-security.xml:ro
      - ./infra/docker/ranger/ranger-trino-audit.xml:/etc/trino/ranger/ranger-trino-audit.xml:ro
      - ./infra/docker/trino/etc/event-listener.properties:/etc/trino/event-listener.properties:ro

  # --- Airflow services ---

  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: ./infra/docker/airflow
      dockerfile: Dockerfile
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true &&
      echo 'Airflow init complete'
      "
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez:5000", "endpoint": "api/v1/lineage"}'
      AIRFLOW__OPENLINEAGE__NAMESPACE: lakehouse
      AIRFLOW__OPENLINEAGE__CONFIG_PATH: ""
      AIRFLOW__PROVIDERS_APACHE_SPARK__INJECT_PARENT_JOB_INFO: "true"
      AIRFLOW__PROVIDERS_APACHE_SPARK__INJECT_TRANSPORT_INFO: "true"
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      OPENLINEAGE_URL: http://marquez:5000
      OPENLINEAGE_NAMESPACE: lakehouse
      NESSIE_URI: http://nessie:19120
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123456
    depends_on:
      airflow-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-webserver:
    build:
      context: ./infra/docker/airflow
      dockerfile: Dockerfile
    command: airflow webserver
    ports:
      - "8081:8080"
    environment:
      <<: *airflow-env
    volumes:
      - ./etl/dags:/opt/airflow/dags:ro
      - ./etl/src:/opt/airflow/etl_src:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    build:
      context: ./infra/docker/airflow
      dockerfile: Dockerfile
    command: airflow scheduler
    environment:
      <<: *airflow-env
    volumes:
      - ./etl/dags:/opt/airflow/dags:ro
      - ./etl/src:/opt/airflow/etl_src:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-worker:
    build:
      context: ./infra/docker/airflow
      dockerfile: Dockerfile
    command: airflow celery worker
    environment:
      <<: *airflow-env
    volumes:
      - ./etl/dags:/opt/airflow/dags:ro
      - ./etl/src:/opt/airflow/etl_src:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Marquez (OpenLineage backend) ---

  marquez-db:
    image: postgres:15
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5434:5432"
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 10s
      timeout: 5s
      retries: 5

  marquez:
    image: marquezproject/marquez:0.50.0
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/namespaces"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    ports:
      - "3000:3000"
    depends_on:
      marquez:
        condition: service_healthy
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000

  # --- Observability stack (Grafana + Prometheus + StatsD) ---

  statsd-exporter:
    image: prom/statsd-exporter:latest
    ports:
      - "9125:9125/udp"
      - "9102:9102"
    command:
      - "--statsd.listen-udp=:9125"
      - "--web.listen-address=:9102"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - statsd-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- Apache Ranger services ---
  # NOTE: The Ranger Trino plugin JAR (ranger-2.8.0-trino-plugin.tar.gz) targets Trino 433.
  # We use Trino 479 which may require building the plugin from source. The config files
  # below are prepared for local dev; plugin JAR compatibility must be verified at integration
  # test time. See: https://ranger.apache.org/quick_start_guide.html

  ranger-zk:
    image: apache/ranger-zk:2.8.0
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ranger-solr:
    image: apache/ranger-solr:2.8.0
    depends_on:
      ranger-zk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/ranger_audits/admin/ping"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  ranger-db:
    image: postgres:15
    environment:
      POSTGRES_DB: ranger
      POSTGRES_USER: ranger
      POSTGRES_PASSWORD: ranger_local_dev
    ports:
      - "5435:5432"
    volumes:
      - ranger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranger -d ranger"]
      interval: 10s
      timeout: 5s
      retries: 5

  ranger-admin:
    image: apache/ranger:2.8.0
    ports:
      - "6080:6080"
      - "6182:6182"
    depends_on:
      ranger-db:
        condition: service_healthy
      ranger-solr:
        condition: service_started
      ranger-zk:
        condition: service_healthy
    environment:
      RANGER_DB_TYPE: postgres
      DB_HOST: ranger-db
      DB_PORT: "5432"
      DB_NAME: ranger
      DB_USER: ranger
      DB_PASSWORD: ranger_local_dev
      AUDIT_SOLR_URLS: http://ranger-solr:8983/solr/ranger_audits
      JAVA_OPTS: "-Xmx3g -Xms1g"
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/login.jsp"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s

  # Audit receiver: lightweight HTTP service capturing Trino query events.
  # Implementation: see Plan 03-03 (audit trail). Placeholder for event-listener config.
  audit-receiver:
    image: python:3.11-slim
    command: >
      python3 -c "
      import http.server, json, sys
      class Handler(http.server.BaseHTTPRequestHandler):
        def do_POST(self):
          length = int(self.headers.get('Content-Length', 0))
          body = self.rfile.read(length)
          self.send_response(200)
          self.end_headers()
          self.wfile.write(b'OK')
        def log_message(self, fmt, *args): pass
      print('audit-receiver listening on :8090', flush=True)
      http.server.HTTPServer(('0.0.0.0', 8090), Handler).serve_forever()
      "
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/')\" 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- OpenMetadata data catalog services ---

  om-db:
    image: postgres:15
    environment:
      POSTGRES_DB: openmetadata
      POSTGRES_USER: openmetadata
      POSTGRES_PASSWORD: openmetadata_dev
    ports:
      - "5436:5432"
    volumes:
      - om-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmetadata -d openmetadata"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.6.0
    ports:
      - "8585:8585"
    mem_limit: 6g
    environment:
      DB_HOST: om-db
      DB_PORT: "5432"
      DB_USER: openmetadata
      DB_PASSWORD: openmetadata_dev
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8086
      LOG_LEVEL: INFO
    depends_on:
      om-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8585/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s

  openmetadata-ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:1.6.0
    ports:
      - "8086:8080"
    mem_limit: 8g
    environment:
      OPENMETADATA_SERVER_URL: http://openmetadata-server:8585/api
      LOG_LEVEL: INFO
    depends_on:
      openmetadata-server:
        condition: service_healthy
    volumes:
      - ./infra/docker/openmetadata/connectors:/home/airflow/connectors:ro

volumes:
  pgdata:
  miniodata:
  airflow-db-data:
  marquez-db-data:
  prometheus-data:
  grafana-data:
  ranger-db-data:
  om-db-data:
  es-data:
