title: "Day 1 Checklist"
subtitle: "Setup, first pipeline, and first PR -- one printed page"
page_type: "checklist"
output_filename: "day1-checklist.html"

sections:
  - heading: "Environment Setup"
    bullet_items:
      - text: "Clone the lakehouse repository"
        verify: "ls docker-compose.yml"
      - text: "Install Python dependencies"
        verify: "cd etl && pip install -e '.[dev]'"
      - text: "Docker Compose up (all services)"
        verify: "docker ps | wc -l shows 25+"
      - text: "Airflow healthy"
        verify: "curl -s http://localhost:8081/health"
      - text: "Trino responding"
        verify: "docker exec trino trino --execute 'SELECT 1'"
      - text: "Nessie catalog online"
        verify: "curl -s http://localhost:19120/api/v2/config"
      - text: "MinIO storage ready"
        verify: "curl -s http://localhost:9000/minio/health/live"
      - text: "Run full test suite"
        verify: "cd etl && python3 -m pytest tests/ -x -m unit (500+ passing)"

  - heading: "First Pipeline"
    bullet_items:
      - text: "Read BasePipeline source code"
        verify: "cat etl/src/pipelines/base.py"
      - text: "Create hello_world pipeline"
        verify: "ls etl/src/pipelines/bronze/hello_world.py"
      - text: "Write pipeline test"
        verify: "ls etl/tests/test_hello_world.py"
      - text: "Run pipeline test"
        verify: "cd etl && python3 -m pytest tests/test_hello_world.py -x"
      - text: "Check Bronze output in Trino"
        verify: "docker exec trino trino --execute 'SHOW TABLES FROM lakehouse.bronze'"

  - heading: "First PR"
    bullet_items:
      - text: "Create feature branch"
        verify: "git checkout -b feature/TICKET-hello-world"
      - text: "Run pre-commit hooks"
        verify: "pre-commit run --all-files"
      - text: "Commit and push"
        verify: "git push -u origin feature/TICKET-hello-world"
      - text: "Create PR via GitHub"
        verify: "gh pr create"
      - text: "CI checks pass"
        verify: "gh pr checks"

links:
  - text: "Getting Started (detailed setup)"
    href: "onboarding.html"
  - text: "Write Your First Pipeline (full tutorial)"
    href: "first-pipeline.html"
  - text: "Contributor Guidelines (PR process)"
    href: "contributor.html"
