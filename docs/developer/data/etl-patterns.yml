title: "ETL Patterns Reference"
subtitle: "Standardized patterns for the lakehouse Python/PySpark ETL framework"
page_type: "reference"
output_filename: "etl-patterns.html"

sections:
  - heading: "1. Medallion Architecture Overview"
    description: "All data flows through three layers in the medallion architecture."
    entries:
      - name: "Bronze"
        type: "layer"
        description: "Raw-as-is with metadata. Namespace: <code>lakehouse.bronze.*</code>. Full history retention."
      - name: "Silver"
        type: "layer"
        description: "Cleaned, deduplicated, entity-centric. Namespace: <code>lakehouse.silver.*</code>. Full history retention."
      - name: "Gold"
        type: "layer"
        description: "Pre-aggregated metrics and curated views. Namespace: <code>lakehouse.gold.*</code>. Full history retention."

  - heading: "Data Flow"
    description: "End-to-end data flow through Bronze, Silver, and Gold layers with quality gates."
    entries:
      - name: "Source to Bronze"
        type: "stage"
        description: "Raw ingestion with metadata columns (source_system, ingestion_ts, batch_id). Critical quality gate blocks bad data."
      - name: "Bronze to Silver"
        type: "stage"
        description: "Deduplication and business rules applied. Critical quality gate validates entity integrity."
      - name: "Silver to Gold"
        type: "stage"
        description: "Aggregation and curation for analytics consumers."

  - heading: "Namespace Convention and Metadata"
    description: "Format: <code>lakehouse.{layer}.{entity}</code>. The <code>lakehouse</code> prefix is the Iceberg catalog name (Nessie REST catalog)."
    entries:
      - name: "source_system"
        type: "STRING"
        description: "Identifier for the data source (e.g., 'trading_platform'). Added to every Bronze table."
      - name: "ingestion_ts"
        type: "TIMESTAMP"
        description: "Timestamp when the record was ingested. Added to every Bronze table."
      - name: "batch_id"
        type: "STRING"
        description: "Unique identifier for the ingestion batch. Added to every Bronze table."

  - heading: "2. Creating a New Pipeline"
    description: "All pipelines must extend <code>BasePipeline</code> from <code>src.pipelines.base</code>. This enforces the extract -> transform -> validate_schema -> quality_check -> write contract."
    entries:
      - name: "Step 1: Extend BasePipeline"
        type: "step"
        description: "Create a class extending BasePipeline with a PipelineConfig specifying name, target_layer, target_table, target_schema, and quality_checks_path."
      - name: "Step 2: Run the Pipeline"
        type: "step"
        description: "Call <code>pipeline.execute()</code> to run extract -> transform -> validate_schema -> quality_check -> write. Returns dict with rows_written and quality results."
      - name: "Step 3: Add Quality Checks"
        type: "step"
        description: "Create a SodaCL YAML file (see Section 3) and reference it in <code>PipelineConfig.quality_checks_path</code>."
      - name: "Step 4: Create Airflow DAG"
        type: "step"
        description: "Create a DAG file in <code>etl/dags/</code> following the patterns in Section 4."

  - heading: "Pipeline Code Example"
    description: "Minimal Bronze pipeline extending BasePipeline."
    entries:
      - name: "BasePipeline"
        type: "class"
        description: "Abstract base class at <code>src.pipelines.base</code>. Provides extract/transform/validate_schema/quality_check/write contract."
      - name: "PipelineConfig"
        type: "dataclass"
        description: "Frozen dataclass for pipeline configuration: name, target_layer, target_table, target_schema, quality_checks_path, critical_checks."
      - name: "MedallionLayer"
        type: "enum"
        description: "Enum with BRONZE, SILVER, GOLD values. Determines target namespace prefix."
      - name: "execute()"
        type: "method"
        description: "Entry point. Runs the full pipeline contract and returns <code>{rows_written: int, quality: dict}</code>."

  - heading: "3. Data Quality Integration"
    description: "Quality checks use Soda Core with SodaCL YAML definitions. Each layer has its own checks file."
    entries:
      - name: "Critical Checks"
        type: "gate"
        description: "Block pipeline progression. Use for: schema validation, PK null/unique, referential integrity. Raises <code>QualityGateError</code> on failure."
      - name: "Advisory Checks"
        type: "gate"
        description: "Generate warnings, pipeline continues. Use for: completeness rates, range validation, outlier detection."
      - name: "SodaCL YAML"
        type: "format"
        description: "Define checks in <code>src/quality/checks/{layer}_{entity}.yml</code>. Reference in <code>PipelineConfig.quality_checks_path</code>."
      - name: "Quality Results"
        type: "dict"
        description: "Returned as <code>{passed: bool, critical_failures: list, warnings: list, all_results: list}</code>. Consumed by Grafana dashboards."

  - heading: "SodaCL Example"
    description: "Example SodaCL YAML for Bronze quality checks."
    entries:
      - name: "primary_key_not_null"
        type: "critical"
        description: "<code>missing_count(id) = 0</code> -- Primary key must not be null."
      - name: "primary_key_unique"
        type: "critical"
        description: "<code>duplicate_count(id) = 0</code> -- Primary key must be unique."
      - name: "schema_required_columns"
        type: "critical"
        description: "Schema check: fail when required columns missing (id, name, source_system)."
      - name: "name_completeness"
        type: "advisory"
        description: "<code>missing_percent(name) < 5</code> -- Data completeness threshold."

  - heading: "4. Airflow DAG Patterns"
    description: "Hybrid DAG design: source-specific Bronze/Silver DAGs, separate cross-source Gold DAGs."
    entries:
      - name: "Source-specific DAG"
        type: "pattern"
        description: "One DAG per source, Bronze -> Silver. Example: <code>bronze_silver_trades</code>."
      - name: "Cross-source Gold DAG"
        type: "pattern"
        description: "Separate DAG for aggregation across sources. Example: <code>gold_trading_metrics</code>."
      - name: "Maintenance DAG"
        type: "pattern"
        description: "Weekly Iceberg maintenance (compaction, snapshot expiry). Example: <code>iceberg_maintenance</code>."
      - name: "Quality Report DAG"
        type: "pattern"
        description: "Daily quality monitoring across all layers. Example: <code>quality_monitoring_report</code>."

  - heading: "DAG Configuration"
    description: "Standard DAG defaults and schedule conventions."
    entries:
      - name: "default_args"
        type: "config"
        description: "owner: data-engineering, retries: 3, retry_delay: 2min, exponential backoff enabled, max_retry_delay: 30min."
      - name: "Bronze/Silver Schedule"
        type: "schedule"
        description: "06:00-07:00 UTC. Early morning when source data is available."
      - name: "Gold Schedule"
        type: "schedule"
        description: "08:00 UTC. After Bronze/Silver pipelines complete."
      - name: "Quality Report"
        type: "schedule"
        description: "09:00 UTC. After all pipelines complete."
      - name: "Maintenance"
        type: "schedule"
        description: "Sunday 02:00 UTC. Low-traffic window for Iceberg table optimization."

  - heading: "5. Incremental Loading"
    description: "Two approaches for incremental loading: watermark-based for batch sources and CDC for real-time change capture."
    entries:
      - name: "Watermark-Based"
        type: "pattern"
        description: "For sources without CDC. Uses <code>IncrementalConfig</code> with watermark_column, merge_keys, target_table. High-water mark read from Iceberg table metadata."
      - name: "CDC (Debezium)"
        type: "pattern"
        description: "Real-time: Debezium captures DB2 logs, events land in Kafka, Spark Structured Streaming reads and applies MERGE INTO Iceberg tables."
      - name: "MERGE INTO"
        type: "SQL"
        description: "Upsert pattern: <code>MERGE INTO target USING source ON key WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *</code>."
      - name: "merge_incremental()"
        type: "function"
        description: "Utility at <code>src.pipelines.incremental</code>. Handles temporary view creation and Spark SQL MERGE INTO automatically."

  - heading: "6. Mainframe Source Handling"
    description: "Mainframe flat files use COBOL copybooks parsed by Cobrix, a Spark data source for EBCDIC encoding."
    entries:
      - name: "MainframeBronzePipeline"
        type: "class"
        description: "At <code>src.pipelines.bronze.mainframe_ingest</code>. Takes data_path, copybook_path, source_system, batch_id. Cobrix derives schema from copybook at runtime."
      - name: "Cobrix"
        type: "library"
        description: "Spark data source for COBOL copybooks. Handles EBCDIC encoding, packed decimal (COMP-3), and complex record layouts."
      - name: "DB2 z/OS JDBC"
        type: "driver"
        description: "<code>ibm_db</code> Python driver for direct mainframe database access."
      - name: "Error Handling"
        type: "pattern"
        description: "Graceful skip when Cobrix JAR unavailable (<code>CobrixNotAvailableError</code>). Unit tests use mock data; integration tests need real EBCDIC binary files."

  - heading: "7. Testing Patterns"
    description: "Unit tests run without Spark or Docker. Integration tests require the full Docker stack."
    entries:
      - name: "Unit Tests"
        type: "pattern"
        description: "Mock PySpark at module level with <code>unittest.mock</code>. Use <code>@pytest.mark.unit</code>. Test schemas via StructType assertions, classification/filtering logic directly."
      - name: "Integration Tests"
        type: "pattern"
        description: "Require Docker services (Nessie, MinIO, Spark). Use <code>@pytest.mark.integration</code>. Use <code>spark_session</code> fixture from conftest.py."
      - name: "Reconciliation"
        type: "pattern"
        description: "Use <code>reconcile_table()</code> from <code>src.quality.reconciliation</code> to validate migration accuracy. Checks row counts, checksums, key columns with configurable tolerance."

  - heading: "8. Quick Reference"
    description: "Common import paths, naming conventions, and financial precision rules."
    entries:
      - name: "BasePipeline"
        type: "import"
        description: "<code>from src.pipelines.base import BasePipeline, MedallionLayer, PipelineConfig</code>"
      - name: "Quality Scanner"
        type: "import"
        description: "<code>from src.quality.scanner import run_soda_checks, QualityCheckResult</code>"
      - name: "Incremental"
        type: "import"
        description: "<code>from src.pipelines.incremental import IncrementalConfig, get_last_watermark, merge_incremental</code>"
      - name: "Iceberg Utils"
        type: "import"
        description: "<code>from src.iceberg_utils.catalog import get_spark_session, create_namespace</code>"
      - name: "Job Inventory"
        type: "import"
        description: "<code>from src.inventory.catalog import JobInventory</code>"
      - name: "Financial Precision"
        type: "rule"
        description: "All monetary values use <code>DecimalType(38, 4)</code>. Never use FloatType or DoubleType for financial amounts."
      - name: "Table Naming"
        type: "convention"
        description: "snake_case entity: <code>trades</code>, <code>positions</code>, <code>trading_metrics</code>"
      - name: "DAG ID Naming"
        type: "convention"
        description: "snake_case with layer prefix: <code>bronze_silver_trades</code>, <code>gold_trading_metrics</code>"
      - name: "Pipeline Class"
        type: "convention"
        description: "PascalCase with Layer suffix: <code>TradesBronzePipeline</code>, <code>TradingMetricsGoldPipeline</code>"
      - name: "Quality File"
        type: "convention"
        description: "<code>{layer}_{entity}.yml</code>: <code>bronze_trades.yml</code>, <code>silver_trades.yml</code>"
      - name: "Test File"
        type: "convention"
        description: "<code>test_{module}.py</code>: <code>test_base_pipeline.py</code>, <code>test_job_inventory.py</code>"
