title: "Developer Documentation"
subtitle: "Guides, References, and Tools for Lakehouse Engineers"
page_type: "dev-index"
output_filename: "index.html"

page_groups:
  - audience: "New Engineers"
    audience_class: "audience-new-engineers"
    pages:
      - title: "Getting Started"
        filename: "onboarding.html"
        description: "Prerequisites, local setup, Docker Compose launch"
      - title: "Repository Structure"
        filename: "repo-structure.html"
        description: "Directory layout and key files"
      - title: "Write Your First Pipeline"
        filename: "first-pipeline.html"
        description: "Step-by-step CSV-to-Bronze tutorial"
      - title: "Day 1 Checklist"
        filename: "day1-checklist.html"
        description: "Printable onboarding checklist"

  - audience: "All Engineers"
    audience_class: "audience-all-engineers"
    pages:
      - title: "ETL Patterns Reference"
        filename: "etl-patterns.html"
        description: "Medallion, quality, DAGs, incremental, mainframe"
      - title: "Testing Guide"
        filename: "testing.html"
        description: "Unit tests, markers, CI gates, pytest patterns"
      - title: "CI/CD Workflow"
        filename: "cicd.html"
        description: "PR to production promotion path"
      - title: "Service URLs"
        filename: "service-urls.html"
        description: "All platform services with ports and credentials"
      - title: "Troubleshooting FAQ"
        filename: "troubleshooting.html"
        description: "Common issues with Symptom-Fix-Why format"

  - audience: "Contributors"
    audience_class: "audience-contributors"
    pages:
      - title: "API Reference"
        filename: "api-reference.html"
        description: "All 8 packages with signatures and examples"
      - title: "Pipeline Class Hierarchy"
        filename: "class-hierarchy.html"
        description: "BasePipeline inheritance visualization"
      - title: "Contributor Guidelines"
        filename: "contributor.html"
        description: "Branch naming, PR process, code style, testing"
