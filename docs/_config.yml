# GitHub Pages / Jekyll configuration for chilakos/lakehouse
# This file lives inside docs/ which is the Pages source folder.
# All paths in this file are relative to this directory.

# Site metadata
title: RBC Lakehouse — Architecture
description: >-
  Architecture decision records, position papers, and reference architecture
  for the RBC Enterprise Lakehouse and Lumina data hub program.

# URL behaviour: clean paths. docs/adr/001-foo.md → /adr/001-foo/
# Jekyll converts .md to HTML at clean URLs. The index page is updated to
# match these paths.
permalink: /:path/:basename/

# Markdown engine — kramdown is the default and is well-supported on GitHub Pages.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Apply the default layout to every .md file under docs/ automatically.
# This means we do NOT need to add front matter to any existing markdown file.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Files to exclude from publishing (Python tooling, internal build files).
exclude:
  - "*.py"
  - "__init__.py"
  - render_html.py
  - "**/__pycache__"

# Output a sitemap-friendly structure
keep_files:
  - architecture/diagrams
