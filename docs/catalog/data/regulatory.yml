title: "Regulatory & Compliance Terms"
subtitle: "Definitions and compliance tracing for regulated data concepts"
page_type: "regulatory"
output_filename: "regulatory.html"
intro: "These definitions support BCBS 239 compliance by documenting regulated data concepts, their implementation in the lakehouse, and the end-to-end audit trail from regulatory requirement to source system."
terms:
  - name: "BCBS 239"
    slug: "bcbs-239"
    definition: "Basel Committee principles requiring financial institutions to have strong risk data aggregation capabilities and internal risk reporting practices."
    compliance_context: "The lakehouse supports BCBS 239 compliance through end-to-end data lineage tracking via OpenLineage/Marquez, automated data quality checks, and freshness SLA monitoring."
    audit_trail:
      - stage: "Regulatory Term"
        detail: "BCBS 239 -- Risk Data Aggregation and Reporting"
      - stage: "Gold Tables"
        detail: "gold.trading_metrics, gold.risk_exposure"
      - stage: "Silver Sources"
        detail: "silver.trades_validated, silver.positions_enriched"
      - stage: "Bronze Ingestion"
        detail: "bronze.raw_trades_history, bronze.raw_positions_daily"
      - stage: "Legacy Sources"
        detail: "Teradata DW (trades_history, positions_daily), Snowflake Analytics (risk_metrics)"
    openmetadata_path: "/glossary/bcbs-239"
  - name: "PII"
    slug: "pii"
    definition: "Personally Identifiable Information -- data that could identify a specific individual."
    compliance_context: "PII columns are automatically classified via regex rules (classification.py) and masked for non-privileged users via Ranger tag-based masking policies. Classification levels: PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED."
    data_classification_levels:
      - level: "PUBLIC"
        description: "Market data, non-sensitive business identifiers"
      - level: "INTERNAL"
        description: "Internal business data, not externally shareable"
      - level: "CONFIDENTIAL"
        description: "Personal contact and compensation data"
      - level: "RESTRICTED"
        description: "SSN, tax IDs, account numbers, credit card numbers"
    openmetadata_path: "/glossary/pii"
  - name: "Value at Risk (VaR)"
    slug: "var"
    definition: "Maximum expected loss over a specified time horizon at a given confidence level."
    compliance_context: "VaR at 95% and 99% confidence levels are core BCBS 239 risk metrics. Computed in the gold.risk_exposure table and exposed via the Cube risk_exposure semantic layer for consistent cross-consumer reporting."
    metric_references:
      - measure: "total_var_95"
        cube: "risk_exposure"
        table: "gold.risk_exposure"
      - measure: "total_var_99"
        cube: "risk_exposure"
        table: "gold.risk_exposure"
    openmetadata_path: "/glossary/var"
  - name: "Expected Shortfall"
    slug: "expected-shortfall"
    definition: "Average loss in the tail beyond the VaR threshold, capturing the severity of worst-case scenarios."
    compliance_context: "ES is increasingly required by regulators as a more coherent risk measure than VaR. Like VaR, it is computed in gold.risk_exposure and exposed via the Cube semantic layer."
    metric_references:
      - measure: "total_expected_shortfall"
        cube: "risk_exposure"
        table: "gold.risk_exposure"
    openmetadata_path: "/glossary/expected-shortfall"
