# Airflow 3.1.x configuration for local development
# Most settings are injected via environment variables in Docker Compose.
# This file provides base configuration that env vars override.

[core]
executor = CeleryExecutor
load_examples = False
dags_folder = /opt/airflow/dags

[celery]
broker_url = redis://redis:6379/0
result_backend = db+postgresql://airflow:airflow@airflow-db:5432/airflow

[webserver]
web_server_port = 8080
expose_config = True

[scheduler]
dag_dir_list_interval = 30
min_file_process_interval = 30

[openlineage]
transport = {"type": "http", "url": "http://marquez:5000", "endpoint": "api/v1/lineage"}
namespace = lakehouse
