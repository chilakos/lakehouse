# Trino LDAP Password Authenticator Configuration
#
# Enable LDAP by:
# 1. Setting http-server.authentication.type=PASSWORD in config.properties
# 2. Configuring the following environment variables:
#    - LDAP_URL: LDAP server URL (e.g., ldaps://ldap.company.com:636)
#    - LDAP_USER_BASE_DN: Base DN for user lookups (e.g., ou=people,dc=company,dc=com)
#    - LDAP_BIND_PATTERN: User bind pattern (e.g., uid=${USER},ou=people,dc=company,dc=com)
# 3. Enabling HTTPS in config.properties (required for PASSWORD authentication)
#
# For local development, Trino uses no authentication (default).
# For staging/production, uncomment config.properties LDAP lines and configure these values.

password-authenticator.name=ldap
ldap.url=${ENV:LDAP_URL}
ldap.user-bind-pattern=${ENV:LDAP_BIND_PATTERN}
ldap.user-base-dn=${ENV:LDAP_USER_BASE_DN}
ldap.allow-insecure=false
