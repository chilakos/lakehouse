coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# File-based access control (RBAC)
access-control.name=file
security.config-file=/etc/trino/access-control/rules.json

# LDAP authentication (uncomment for staging/production)
# Enable LDAP by uncommenting the following lines and setting LDAP environment variables:
#   LDAP_URL, LDAP_USER_BASE_DN, LDAP_BIND_PATTERN
# http-server.authentication.type=PASSWORD
# http-server.https.enabled=true
# http-server.https.port=8443
# http-server.https.keystore.path=/etc/trino/tls/keystore.jks
# http-server.https.keystore.key=changeit
