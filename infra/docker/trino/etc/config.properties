coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Workload isolation — routes BI, ETL, AI agent, and quality queries
# to separate memory/concurrency buckets (60% eng / 35% BI / 5% AI)
resource-groups.config-file=/etc/trino/resource-groups/rules.json

# Ranger access control (replaces Phase 1 file-based RBAC)
access-control.name=ranger
ranger.service.name=trino
ranger.plugin.config.resource=/etc/trino/ranger/ranger-trino-security.xml,/etc/trino/ranger/ranger-trino-audit.xml

# Phase 1 file-based RBAC (kept as reference -- replaced by Ranger in Phase 3)
# access-control.name=file
# security.config-file=/etc/trino/access-control/rules.json

# LDAP authentication (uncomment for staging/production)
# Enable LDAP by uncommenting the following lines and setting LDAP environment variables:
#   LDAP_URL, LDAP_USER_BASE_DN, LDAP_BIND_PATTERN
# http-server.authentication.type=PASSWORD
# http-server.https.enabled=true
# http-server.https.port=8443
# http-server.https.keystore.path=/etc/trino/tls/keystore.jks
# http-server.https.keystore.key=changeit
